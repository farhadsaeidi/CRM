<!doctype html>
<html lang="fa-IR" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CRM</title>
    <script>
      // اعمالِ تمِ ذخیره‌شده قبل از اولین رندر — مستقل از هدر/سوییچر
      // (بدونِ این، صفحاتِ بدونِ هدر تمِ دارک را نمی‌گرفتند و فلاشِ لایت داشتند)
      (function () {
        var dark = localStorage.theme === "dark" ||
          (!("theme" in localStorage) && window.matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.classList.toggle("dark", dark);
      })();
    </script>
    <script>
      // ⚠️ ScrollTimeline عمداً پیش از بارگذاریِ باندل برداشته می‌شود.
      //
      // ‏overlayscrollbars 2.16.0 (آخرین نسخه) اگر این API را ببیند، حرکتِ دستهٔ
      // اسکرول را با یک انیمیشنِ ScrollTimeline اداره می‌کند و مسیرِ CSSی را کنار
      // می‌گذارد. ولی هنگام بازساختِ اسکرول‌بارها آن انیمیشن را cancel می‌کند و
      // چون کی‌فریم‌های کش‌شده عوض نشده‌اند دیگر نمی‌سازدش — دسته روی بالای ناحیه
      // قفل می‌شود و با اسکرول تکان نمی‌خورد. مسیرِ CSSی این مشکل را ندارد.
      //
      // کتابخانه این API را در لحظهٔ ارزیابیِ ماژول می‌خواند، پس باید همین‌جا و پیش
      // از اسکریپتِ ماژول برداشته شود. بلافاصله بعد از ایمپورت، در main.jsx
      // برگردانده می‌شود تا برای بقیهٔ صفحه در دسترس بماند.
      window.__ScrollTimeline = window.ScrollTimeline;
      delete window.ScrollTimeline;
    </script>
  </head>
  <body>
    <section id="root"></section>
    <script type="module" src="src/main.jsx"></script>
  </body>
</html>
